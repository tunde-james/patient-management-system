services:
  patient-service-db:
    image: postgres:17
    container_name: patient-service-db
    environment:
      POSTGRES_USER: ${PATIENT_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${PATIENT_SERVICE_DB_PASSWORD}
      POSTGRES_DB: ${PATIENT_SERVICE_DB_NAME}
    ports: []
    volumes:
      - patient-service-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PATIENT_SERVICE_DB_USER} -d ${PATIENT_SERVICE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  billing-service-db:
    image: postgres:17
    container_name: billing-service-db
    environment:
      POSTGRES_USER: ${BILLING_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${BILLING_SERVICE_DB_PASSWORD}
      POSTGRES_DB: ${BILLING_SERVICE_DB_NAME}
    ports: []
    volumes:
      - billing-service-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BILLING_SERVICE_DB_USER} -d ${BILLING_SERVICE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  analytics-service-db:
    image: postgres:17
    container_name: analytics-service-db
    environment:
      POSTGRES_DB: ${ANALYTICS_SERVICE_DB_NAME}
      POSTGRES_USER: ${ANALYTICS_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_SERVICE_DB_PASSWORD}
    ports: []
    volumes:
      - analytics-service-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_SERVICE_DB_USER} -d ${ANALYTICS_SERVICE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    networks:
      - internal
    volumes:
      - kafka-data:/var/lib/kafka/data
  
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    image: patient-service:latest
    container_name: patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/${PATIENT_SERVICE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PATIENT_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_SERVICE_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: billing-service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - internal
    depends_on:
      patient-service-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    image: billing-service:latest
    container_name: billing-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-service-db:5432/${BILLING_SERVICE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${BILLING_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${BILLING_SERVICE_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    networks:
      - internal
    depends_on:
      billing-service-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4001/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: analytics-service:latest
    container_name: analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-service-db:5432/${ANALYTICS_SERVICE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${ANALYTICS_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_SERVICE_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - internal
    depends_on:
      analytics-service-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4002/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "4004:4004"
    networks:
      - internal
    depends_on:
      patient-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4004/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    
volumes:
  patient-service-db-data:
  billing-service-db-data:
  analytics-service-db-data:
  kafka-data:

networks:
  internal:
    driver: bridge

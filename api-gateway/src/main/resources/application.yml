spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api/v1/patients/**

            - id: analytics-service-route
              uri: http://analytics-service:4002
              predicates:
                - Path=/api/v1/analytics/**

            - id: auth-servcie-route
              uri: http://auth-service:4003
              predicates:
              - Path=/api/v1/auth/**

            - id: api-docs-patient-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            - id: api-docs-analytics-route
              uri: http://analytics-service:4002
              predicates:
                - Path=/api-docs/analytics
              filters:
                - RewritePath=/api-docs/analytics,/v3/api-docs

            - id: api-docs-auth-route
              uri: http://auth-service:4003
              predicates:
              - Path=/api-docs/auth
              filters:
              - RewritePath=/api-docs/auth,/v3/api-docs

          httpclient:
            connect-timeout: 5000
            response-timeout: 10s

springdoc:
  swagger-ui:
    urls:
      - name: patient-service
        url: /api-docs/patients
      - name: analytics-service
        url: /api-docs/analytics
      - name: auth-service
        url: /api-docs/auth

server:
  port: 4004

management:
  endpoints:
    web:
      exposure:
        include: health
